name: 'Generate plugin changelog fragments'
inputs:
  repo:
    required: true
  name:
    required: true
  display-name:
    description: >-
      Name shown in the changelog headings (data.yaml `display_name`).
      Defaults to `name`.
    required: false
    default: ''
  release-tag:
    required: true
  previous-tag:
    description: >-
      Release tag the collated changelog header reports as the start of the
      range (e.g. 2026.7.0). A fragment only states its own range when its
      actual previous tag differs from this.
    required: false
    default: ''
  output:
    description: Path for the plugin's "Plugin Updates" fragment.
    required: true
  breaking-output:
    description: Path for the plugin's "Breaking Changes" fragment.
    required: true
outputs:
  has-changes:
    value: ${{ steps.collate-changelog.outputs.has-changes }}
  has-breaking-changes:
    value: ${{ steps.collate-changelog.outputs.has-breaking-changes }}
runs:
  using: composite
  steps:
    - id: 'setup-path'
      shell: bash
      run: echo "${{ github.action_path }}/bin/" >> $GITHUB_PATH
    - id: 'collate-changelog'
      shell: bash
      env:
        PYTHONPATH: "${{ github.action_path }}/../src/"
      run: |
        cat <<EOF | collate-changelog.py
        ${{ toJSON(inputs) }}
        EOF
