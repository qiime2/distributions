name: 'Validate PR Title'
inputs:
  gh-token:
    required: true
  gh-repo:
    required: true
  pr-number:
    required: true

runs:
  using: composite
  steps:
    - id: 'setup-path'
      shell: bash
      run: echo "${{ github.action_path }}/bin/" >> $GITHUB_PATH
    - id: 'validate-pr-title'
      shell: bash
      env:
        PYTHONPATH: "${{ github.action_path }}/../src/"
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        cat <<EOF | validate-pr-title.py
        ${{ toJSON(inputs) }}
        EOF
