name: ci-collate-changelog
# The release range always comes from data.yaml: <released_epoch>.0 ->
# <active_epoch>.0, i.e. the release currently being cut. Run it (standalone
# or via ci-join-release) before data.yaml is bumped to the next epoch.
on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ fromJSON(steps.yaml.outputs.data).active_epoch }}.0
      previous-tag: ${{ fromJSON(steps.yaml.outputs.data).released_epoch }}.0
      plugin-matrix: ${{ steps.yaml.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qiime2/distributions
          sparse-checkout: |
            data.yaml

      - name: "get distro info"
        id: yaml
        uses: qiime2/distributions/.github/actions/read-yaml@dev
        with:
          file: data.yaml

  per-repo:
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        packages: ${{ fromJSON(needs.setup.outputs.plugin-matrix).packages }}
    steps:
      # checkout distributions (this repo) so the local action is available
      - uses: actions/checkout@v4

      - name: "ensure fragments directories"
        shell: bash
        run: mkdir -p fragments/plugins fragments/breaking

      - name: "generate changelog fragment"
        id: fragment
        uses: ./.github/actions/ci-collate-changelog
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        with:
          repo: ${{ matrix.packages.repo }}
          name: ${{ matrix.packages.name }}
          display-name: ${{ matrix.packages.display_name || matrix.packages.name }}
          release-tag: ${{ needs.setup.outputs.release-tag }}
          previous-tag: ${{ needs.setup.outputs.previous-tag }}
          output: fragments/plugins/${{ matrix.packages.name }}.md
          breaking-output: fragments/breaking/${{ matrix.packages.name }}.md

      # uploads plugins/<name>.md and breaking/<name>.md (artifact root is
      # fragments/, so they merge back into that layout on download)
      - uses: actions/upload-artifact@v4
        with:
          name: changelog-fragment-${{ matrix.packages.name }}
          path: fragments/
          retention-days: 7

  collate:
    needs: [setup, per-repo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "download fragments"
        uses: actions/download-artifact@v4
        with:
          pattern: changelog-fragment-*
          path: fragments
          merge-multiple: true

      - name: "assemble changelog"
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release-tag }}
        run: |
          OUT="changelog-${RELEASE_TAG%.0}.md"
          python .github/actions/ci-collate-changelog/bin/assemble-changelog.py \
            --data data.yaml --fragments fragments --output "$OUT"

          # surface in the run (both standalone and when called from join-release)
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: "upload collated changelog"
        uses: actions/upload-artifact@v4
        with:
          name: collated-changelog
          path: ${{ env.OUT }}
          retention-days: 30
