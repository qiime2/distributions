name: ci-collate-patch-changelog
# Changelog for a patch release of the most recent release: per plugin,
# everything from <epoch>.0 to its latest <epoch>.N tag (cumulative across
# patches), as a flat list between the patch announcement's intro and closing.
on:
  workflow_dispatch: {}

jobs:
  changelog:
    uses: ./.github/workflows/ci-collate-changelog.yaml
    with:
      mode: patch
    secrets: inherit
