on:
  workflow_call:
    inputs:
      solved-environment-key:
        required: true
        type: string
      matrix-key:
        required: true
        type: string
      rebuilt-channel-key:
        required: true
        type: string
      patched-channel-key:
        required: true
        type: string
      distro-name:
        required: true
        type: string

jobs:
  test-metapackage:
    uses: ./.github/workflows/ci-distro-trial_3-test-metapackage-platform.yaml
    with:
      solved-environment-key: ${{ inputs.solved-environment-key }}
      matrix-key: ${{ inputs.matrix-key }}
      rebuilt-channel-key: ${{ inputs.rebuilt-channel-key }}
      patched-channel-key: ${{ inputs.patched-channel-key }}
      distro-name: ${{ inputs.distro-name }}
      runner_label: ubuntu-latest
      platform_label: linux-64
