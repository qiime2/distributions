name: create-prepare-pr-linux
on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      distro:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: false

jobs:
  create-prepare-pr:
    uses: ./.github/workflows/create-prepare-pr-platform.yaml
    secrets: inherit
    with:
      distro: ${{ inputs.distro }}
      platform_label: linux-64
      seed_environment_file: seed-environment-conda-linux.yml
      trial_workflow_name: ci-distro-trial-linux
      draft: ${{ inputs.draft }}
