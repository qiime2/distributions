name: create-prepare-pr-osx
on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: false
      platforms:
        description: 'JSON list of macOS platform labels to prepare (osx-64, osx-arm64)'
        required: false
        type: string
        default: '["osx-64", "osx-arm64"]'
  workflow_dispatch:
    inputs:
      distro:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: false
      platforms:
        description: 'JSON list of macOS platform labels to prepare (osx-64, osx-arm64)'
        required: false
        type: string
        default: '["osx-64", "osx-arm64"]'

jobs:
  osx-intel:
    if: ${{ contains(fromJSON(inputs.platforms), 'osx-64') }}
    uses: ./.github/workflows/create-prepare-pr-platform.yaml
    secrets: inherit
    with:
      distro: ${{ inputs.distro }}
      platform_label: osx-64
      seed_environment_file: seed-environment-conda-osx.yml
      trial_workflow_name: ci-distro-trial-osx
      draft: ${{ inputs.draft }}

  osx-arm:
    if: ${{ contains(fromJSON(inputs.platforms), 'osx-arm64') }}
    uses: ./.github/workflows/create-prepare-pr-platform.yaml
    secrets: inherit
    with:
      distro: ${{ inputs.distro }}
      platform_label: osx-arm64
      seed_environment_file: seed-environment-conda-osx.yml
      trial_workflow_name: ci-distro-trial-osx
      draft: ${{ inputs.draft }}
