name: create-prepare-pr-platform
on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      platform_label:
        required: true
        type: string
      seed_environment_file:
        required: true
        type: string
      trial_workflow_name:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
      pr: ${{ steps.pr.outputs.pull-request-number }}
      epoch: ${{ steps.vars.outputs.epoch }}
      branch: ${{ steps.vars.outputs.branch }}
      solved_environment_file: ${{ steps.vars.outputs.solved_environment_file }}
    steps:
      - uses: actions/checkout@v3

      - name: "get distro info"
        id: yaml
        uses: qiime2/distributions/.github/actions/read-yaml@dev
        with:
          file: data.yaml

      - name: set epoch, date, and derived values
        id: vars
        shell: bash
        run: |
          epoch='${{ fromJSON(steps.yaml.outputs.data).active_epoch }}'
          today=$(date +'%Y-%m-%d')
          branch='Prepare-${{ inputs.platform_label }}-'"$epoch"'/${{ inputs.distro }}/'"$today"
          solved_environment_file='rachis-${{ inputs.distro }}-${{ inputs.platform_label }}-conda.yml'

          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "solved_environment_file=$solved_environment_file" >> "$GITHUB_OUTPUT"

      - name: modify file
        shell: bash
        run: |
          echo '# modified: ${{ steps.vars.outputs.today }}' >> '${{ steps.vars.outputs.epoch }}/${{ inputs.distro }}/passed/${{ inputs.seed_environment_file }}'

      - name: Create Pull Request
        id: pr
        # Replaces qiime2/create-pull-request@v5
        # (previously forked from peter-evans/create-pull-request)
        uses: qiime2-cutlery/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          branch: ${{ steps.vars.outputs.branch }}
          draft: ${{ inputs.draft }}
          title: "[${{ inputs.distro }}] Automated Trial (Prepare) - ${{ inputs.platform_label }}"
          body: |
            Automated updates from `create-prepare-pr-platform.yaml` for `${{ inputs.platform_label }}`
            triggered by ${{ github.event_name }}.
          author: "q2d2 <q2d2.noreply@gmail.com>"
          committer: "q2d2 <q2d2.noreply@gmail.com>"
          commit-message: |
            Automated updates to ${{ inputs.platform_label }} seed environment: ${{ inputs.distro }}

  await-workflow:
    needs: [create-pr]
    runs-on: ubuntu-latest
    outputs:
      gh-response: ${{ steps.merge-trial.outputs.gh-response }}
      merged: ${{ steps.merge-trial.outputs.merged }}
    steps:
      - name: get workflow id
        id: get-id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30  # let the workflow start
          echo run-id=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/qiime2/distributions/actions/runs?head_sha=${{ needs.create-pr.outputs.sha }} \
              -q '.workflow_runs[] | select(.name == "${{ inputs.trial_workflow_name }}").id' | head -n 1
          ) >> "$GITHUB_OUTPUT"

      - name: await workflow id ${{ steps.get-id.outputs.run-id }}
        # Forked from Codex-/await-remote-run@v1.0.0
        uses: qiime2-cutlery/await-remote-run@v1.0.0
        with:
          token: ${{ github.token }}
          repo: distributions
          owner: qiime2
          run_id: ${{ steps.get-id.outputs.run-id }}
          run_timeout_seconds: 21600
          poll_interval_ms: 45000

      - name: merge trial
        id: merge-trial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GH_RESPONSE=$(
            gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/qiime2/distributions/pulls/${{ needs.create-pr.outputs.pr }}/merge
          )
          MERGED=$(
            python3 -c 'import json, sys; print(str(json.load(sys.stdin).get("merged", False)).lower())' <<< "$GH_RESPONSE"
          )

          echo "gh-response=$GH_RESPONSE" >> "$GITHUB_OUTPUT"
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

  update-latest-envs:
    needs: [create-pr, await-workflow]
    runs-on: ubuntu-latest
    outputs:
      env-pr: ${{ steps.env-updates-pr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v3

      - name: refresh dev after prepare pr merge
        if: ${{ needs.await-workflow.outputs.merged == 'true' }}
        shell: bash
        run: |
          git fetch origin dev
          git checkout --force -B dev origin/dev

      - name: copy updated env file from merged prepare pr
        id: copy-env
        if: ${{ needs.await-workflow.outputs.merged == 'true' }}
        run: |
          cp '${{ needs.create-pr.outputs.epoch }}/${{ inputs.distro }}/passed/${{ needs.create-pr.outputs.solved_environment_file }}' './latest/passed/'

      - name: detect latest env changes
        id: latest-env-diff
        if: ${{ needs.await-workflow.outputs.merged == 'true' }}
        shell: bash
        run: |
          if git status --porcelain -- ./latest/passed/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open Pull Request to update latest env file
        id: env-updates-pr
        if: ${{ needs.await-workflow.outputs.merged == 'true' && steps.latest-env-diff.outputs.changed == 'true' }}
        # Replaces qiime2/create-pull-request@v5
        # (previously forked from peter-evans/create-pull-request)
        uses: qiime2-cutlery/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          branch: update-latest-envs-from-PR-${{ needs.create-pr.outputs.pr }}
          title: "[${{ inputs.distro }}] latest env updates from PR ${{ needs.create-pr.outputs.pr }}"
          add-paths: ./latest/passed/
          body: |
            Automated updates to latest env files from `create-prepare-pr-platform.yaml` for `${{ inputs.platform_label }}`
            triggered by ${{ github.event_name }}.
          author: "q2d2 <q2d2.noreply@gmail.com>"
          committer: "q2d2 <q2d2.noreply@gmail.com>"
          commit-message: |
            Automated updates to latest resolved ${{ inputs.platform_label }} environment file: ${{ needs.create-pr.outputs.epoch }} ${{ inputs.distro }}

  merge-latest-env-pr:
    needs: [update-latest-envs]
    runs-on: ubuntu-latest
    if: ${{ needs.update-latest-envs.outputs.env-pr != '' }}
    steps:
      - name: merge env updates
        id: merge-env-pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/qiime2/distributions/pulls/${{ needs.update-latest-envs.outputs.env-pr }}/merge
