name: cron-prepare-osx
on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 0 * * SUN

jobs:
  tiny:
    uses: ./.github/workflows/create-prepare-pr-osx.yaml
    secrets: inherit
    with:
      distro: tiny

  qiime2:
    needs: [tiny]
    uses: ./.github/workflows/create-prepare-pr-osx.yaml
    secrets: inherit
    with:
      distro: qiime2
