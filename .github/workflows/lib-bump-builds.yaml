              dst_dir = f'{active_epoch}/{distro}/{subdir}'
              os.makedirs(dst_dir, exist_ok=True)
              with open(src) as f:
                  content = f.read()
              content = re.sub(
                  r'(?m)^(- https://packages\.qiime2\.org/qiime2/)[^\s]+',
                  rf'\1{released_epoch}/{distro}/released',
                  content, count=1
              )
              content = re.sub(
                  r"(qiime2_epoch:\s*')[^']+'",
                  rf"\1{active_epoch}'",
                  content
              )
              with open(f'{dst_dir}/seed-environment-conda-osx.yml', 'w') as f:
                  f.write(content)
          EOF

      - name: create osx-64 pull request
        id: pr
        uses: qiime2-cutlery/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          branch: Prepare-osx-64-${{ needs.setup.outputs.active-epoch }}-devbump/${{ inputs.distro }}
          title: "PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/osx-64)"
          body: |
            Automated dev bump for `${{ inputs.distro }}` osx-64 triggered by `bump-builds.yaml`.
          author: "q2d2 <q2d2.noreply@gmail.com>"
          committer: "q2d2 <q2d2.noreply@gmail.com>"
          commit-message: |
            PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/osx-64)

  await-osx-64:
