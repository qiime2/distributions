on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      active-epoch: ${{ steps.vars.outputs.active-epoch }}
      released-epoch: ${{ steps.vars.outputs.released-epoch }}
      has-osx: ${{ steps.vars.outputs.has-osx }}
      has-osx-arm: ${{ steps.vars.outputs.has-osx-arm }}
    steps:
      - uses: actions/checkout@v3
      - name: read epochs and check platform support
        id: vars
        run: |
          python3 - <<'EOF'
          import os, yaml

          data = yaml.safe_load(open('data.yaml'))
          active_epoch = data['active_epoch']
          released_epoch = data['released_epoch']
          distro = '${{ inputs.distro }}'
          passed = f'{released_epoch}/{distro}/passed'

          has_osx = os.path.isfile(f'{passed}/seed-environment-conda-osx.yml')
          has_osx_arm = os.path.isfile(f'{passed}/rachis-{distro}-osx-arm64-conda.yml')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'active-epoch={active_epoch}\n')
              f.write(f'released-epoch={released_epoch}\n')
              f.write(f'has-osx={"true" if has_osx else "false"}\n')
              f.write(f'has-osx-arm={"true" if has_osx_arm else "false"}\n')
          EOF

  # ── linux-64 ──────────────────────────────────────────────────────────────

  create-linux-pr:
    needs: [setup]
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: create linux seed env files
        run: |
          python3 - <<'EOF'
          import os, re

          active_epoch = '${{ needs.setup.outputs.active-epoch }}'
          released_epoch = '${{ needs.setup.outputs.released-epoch }}'
          distro = '${{ inputs.distro }}'

          for subdir in ('passed', 'staged'):
              src = f'{released_epoch}/{distro}/{subdir}/seed-environment-conda-linux.yml'
              dst_dir = f'{active_epoch}/{distro}/{subdir}'
              os.makedirs(dst_dir, exist_ok=True)
              with open(src) as f:
                  content = f.read()
              content = re.sub(
                  r'(?m)^(- https://packages\.qiime2\.org/qiime2/)[^\s]+',
                  rf'\1{released_epoch}/{distro}/released',
                  content, count=1
              )
              content = re.sub(
                  r"(qiime2_epoch:\s*')[^']+'",
                  rf"\1{active_epoch}'",
                  content
              )
              with open(f'{dst_dir}/seed-environment-conda-linux.yml', 'w') as f:
                  f.write(content)
          EOF

      - name: create linux pull request
        id: pr
        uses: qiime2-cutlery/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          branch: Prepare-linux-64-${{ needs.setup.outputs.active-epoch }}-devbump/${{ inputs.distro }}
          title: "PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/linux-64)"
          body: |
            Automated dev bump for `${{ inputs.distro }}` linux-64 triggered by `bump-builds.yaml`.
          author: "q2d2 <q2d2.noreply@gmail.com>"
          committer: "q2d2 <q2d2.noreply@gmail.com>"
          commit-message: |
            PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/linux-64)

  await-linux:
    needs: [create-linux-pr]
    runs-on: ubuntu-latest
    steps:
      - name: await linux trial
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.create-linux-pr.outputs.pr }}
        run: |
          echo "Waiting 60s for trial to start..."
          sleep 60

          TIMEOUT=21600
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEAD_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')

            RUN=$(gh api \
              "repos/qiime2/distributions/actions/runs?head_sha=$HEAD_SHA" \
              --jq '[.workflow_runs[] | select(.name == "ci-distro-trial-linux")] | first')

            if [ "$RUN" = "null" ] || [ -z "$RUN" ]; then
              echo "No run found yet for SHA $HEAD_SHA, waiting..."
              sleep 45; ELAPSED=$((ELAPSED + 45)); continue
            fi

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            echo "Run $RUN_ID (SHA $HEAD_SHA): status=$STATUS conclusion=$CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Linux trial succeeded."; exit 0
              else
                sleep 30
                NEW_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')
                if [ "$NEW_SHA" != "$HEAD_SHA" ]; then
                  echo "New commit detected ($NEW_SHA), continuing to poll..."
                  sleep 30; ELAPSED=$((ELAPSED + 60)); continue
                fi
                echo "Trial failed with conclusion: $CONCLUSION"; exit 1
              fi
            fi

            sleep 45; ELAPSED=$((ELAPSED + 45))
          done

          echo "Timed out waiting for linux trial."; exit 1

  merge-linux:
    needs: [create-linux-pr, await-linux]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.create-linux-pr.result == 'success' &&
      needs.await-linux.result == 'success'
    steps:
      - name: merge linux pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/qiime2/distributions/pulls/${{ needs.create-linux-pr.outputs.pr }}/merge

  # ── osx-64 ────────────────────────────────────────────────────────────────

  create-osx-64-pr:
    needs: [setup]
    if: ${{ needs.setup.outputs.has-osx == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: create osx seed env files
        run: |
          python3 - <<'EOF'
          import os, re

          active_epoch = '${{ needs.setup.outputs.active-epoch }}'
          released_epoch = '${{ needs.setup.outputs.released-epoch }}'
          distro = '${{ inputs.distro }}'

          for subdir in ('passed', 'staged'):
              src = f'{released_epoch}/{distro}/{subdir}/seed-environment-conda-osx.yml'
              dst_dir = f'{active_epoch}/{distro}/{subdir}'
              os.makedirs(dst_dir, exist_ok=True)
              with open(src) as f:
                  content = f.read()
              content = re.sub(
                  r'(?m)^(- https://packages\.qiime2\.org/qiime2/)[^\s]+',
                  rf'\1{released_epoch}/{distro}/released',
                  content, count=1
              )
              content = re.sub(
                  r"(qiime2_epoch:\s*')[^']+'",
                  rf"\1{active_epoch}'",
                  content
              )
              with open(f'{dst_dir}/seed-environment-conda-osx.yml', 'w') as f:
                  f.write(content)
          EOF

      - name: create osx-64 pull request
        id: pr
        uses: qiime2-cutlery/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          branch: Prepare-osx-64-${{ needs.setup.outputs.active-epoch }}-devbump/${{ inputs.distro }}
          title: "PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/osx-64)"
          body: |
            Automated dev bump for `${{ inputs.distro }}` osx-64 triggered by `bump-builds.yaml`.
          author: "q2d2 <q2d2.noreply@gmail.com>"
          committer: "q2d2 <q2d2.noreply@gmail.com>"
          commit-message: |
            PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/osx-64)

  await-osx-64:
    needs: [create-osx-64-pr]
    runs-on: ubuntu-latest
    steps:
      - name: await osx-64 trial
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.create-osx-64-pr.outputs.pr }}
        run: |
          echo "Waiting 60s for trial to start..."
          sleep 60

          TIMEOUT=21600
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEAD_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')

            RUN=$(gh api \
              "repos/qiime2/distributions/actions/runs?head_sha=$HEAD_SHA" \
              --jq '[.workflow_runs[] | select(.name == "ci-distro-trial-osx")] | first')

            if [ "$RUN" = "null" ] || [ -z "$RUN" ]; then
              echo "No run found yet for SHA $HEAD_SHA, waiting..."
              sleep 45; ELAPSED=$((ELAPSED + 45)); continue
            fi

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            echo "Run $RUN_ID (SHA $HEAD_SHA): status=$STATUS conclusion=$CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "OSX-64 trial succeeded."; exit 0
              else
                sleep 30
                NEW_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')
                if [ "$NEW_SHA" != "$HEAD_SHA" ]; then
                  echo "New commit detected ($NEW_SHA), continuing to poll..."
                  sleep 30; ELAPSED=$((ELAPSED + 60)); continue
                fi
                echo "Trial failed with conclusion: $CONCLUSION"; exit 1
              fi
            fi

            sleep 45; ELAPSED=$((ELAPSED + 45))
          done

          echo "Timed out waiting for osx-64 trial."; exit 1

  merge-osx-64:
    needs: [create-osx-64-pr, await-osx-64]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.create-osx-64-pr.result == 'success' &&
      needs.await-osx-64.result == 'success'
    steps:
      - name: merge osx-64 pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/qiime2/distributions/pulls/${{ needs.create-osx-64-pr.outputs.pr }}/merge

  # ── osx-arm64 ─────────────────────────────────────────────────────────────

  create-osx-arm64-pr:
    needs: [setup]
    if: ${{ needs.setup.outputs.has-osx-arm == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: create osx seed env files
        run: |
          python3 - <<'EOF'
          import os, re

          active_epoch = '${{ needs.setup.outputs.active-epoch }}'
          released_epoch = '${{ needs.setup.outputs.released-epoch }}'
          distro = '${{ inputs.distro }}'

          for subdir in ('passed', 'staged'):
              src = f'{released_epoch}/{distro}/{subdir}/seed-environment-conda-osx.yml'
              dst_dir = f'{active_epoch}/{distro}/{subdir}'
              os.makedirs(dst_dir, exist_ok=True)
              with open(src) as f:
                  content = f.read()
              content = re.sub(
                  r'(?m)^(- https://packages\.qiime2\.org/qiime2/)[^\s]+',
                  rf'\1{released_epoch}/{distro}/released',
                  content, count=1
              )
              content = re.sub(
                  r"(qiime2_epoch:\s*')[^']+'",
                  rf"\1{active_epoch}'",
                  content
              )
              with open(f'{dst_dir}/seed-environment-conda-osx.yml', 'w') as f:
                  f.write(content)
          EOF

      - name: create osx-arm64 pull request
        id: pr
        uses: qiime2-cutlery/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          branch: Prepare-osx-arm64-${{ needs.setup.outputs.active-epoch }}-devbump/${{ inputs.distro }}
          title: "PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/osx-arm64)"
          body: |
            Automated dev bump for `${{ inputs.distro }}` osx-arm64 triggered by `bump-builds.yaml`.
          author: "q2d2 <q2d2.noreply@gmail.com>"
          committer: "q2d2 <q2d2.noreply@gmail.com>"
          commit-message: |
            PREP: ${{ needs.setup.outputs.active-epoch }} dev bump (${{ inputs.distro }}/osx-arm64)

  await-osx-arm64:
    needs: [create-osx-arm64-pr]
    runs-on: ubuntu-latest
    steps:
      - name: await osx-arm64 trial
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.create-osx-arm64-pr.outputs.pr }}
        run: |
          echo "Waiting 60s for trial to start..."
          sleep 60

          TIMEOUT=21600
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEAD_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')

            RUN=$(gh api \
              "repos/qiime2/distributions/actions/runs?head_sha=$HEAD_SHA" \
              --jq '[.workflow_runs[] | select(.name == "ci-distro-trial-osx")] | first')

            if [ "$RUN" = "null" ] || [ -z "$RUN" ]; then
              echo "No run found yet for SHA $HEAD_SHA, waiting..."
              sleep 45; ELAPSED=$((ELAPSED + 45)); continue
            fi

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            echo "Run $RUN_ID (SHA $HEAD_SHA): status=$STATUS conclusion=$CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "OSX-arm64 trial succeeded."; exit 0
              else
                sleep 30
                NEW_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')
                if [ "$NEW_SHA" != "$HEAD_SHA" ]; then
                  echo "New commit detected ($NEW_SHA), continuing to poll..."
                  sleep 30; ELAPSED=$((ELAPSED + 60)); continue
                fi
                echo "Trial failed with conclusion: $CONCLUSION"; exit 1
              fi
            fi

            sleep 45; ELAPSED=$((ELAPSED + 45))
          done

          echo "Timed out waiting for osx-arm64 trial."; exit 1

  merge-osx-arm64:
    needs: [create-osx-arm64-pr, await-osx-arm64]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.create-osx-arm64-pr.result == 'success' &&
      needs.await-osx-arm64.result == 'success'
    steps:
      - name: merge osx-arm64 pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/qiime2/distributions/pulls/${{ needs.create-osx-arm64-pr.outputs.pr }}/merge
