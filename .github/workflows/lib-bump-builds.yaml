          sleep 30
          echo run-id=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/qiime2/distributions/actions/runs?head_sha=${{ needs.create-osx-64-pr.outputs.sha }} \
              -q '.workflow_runs[] | select(.name == "ci-distro-trial-osx").id' | head -n 1
          ) >> "$GITHUB_OUTPUT"

      - name: await osx trial ${{ steps.get-id.outputs.run-id }}
        uses: qiime2-cutlery/await-remote-run@v1.0.0
        with:
          token: ${{ github.token }}
          repo: distributions
          owner: qiime2
          run_id: ${{ steps.get-id.outputs.run-id }}
          run_timeout_seconds: 21600
          poll_interval_ms: 45000

  merge-osx-64:
    needs: [create-osx-64-pr, await-osx-64]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.create-osx-64-pr.result == 'success' &&
      needs.await-osx-64.result == 'success'
    steps:
      - name: merge osx-64 pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/qiime2/distributions/pulls/${{ needs.create-osx-64-pr.outputs.pr }}/merge

  # ── osx-arm64 ─────────────────────────────────────────────────────────────

  create-osx-arm64-pr:
    needs: [setup]
    if: ${{ needs.setup.outputs.has-osx-arm == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: create osx seed env files
        run: |
          python3 - <<'EOF'
          import os, re

          active_epoch = '${{ needs.setup.outputs.active-epoch }}'
          released_epoch = '${{ needs.setup.outputs.released-epoch }}'
          distro = '${{ inputs.distro }}'

          for subdir in ('passed', 'staged'):
              src = f'{released_epoch}/{distro}/{subdir}/seed-environment-conda-osx.yml'
              dst_dir = f'{active_epoch}/{distro}/{subdir}'
              os.makedirs(dst_dir, exist_ok=True)
