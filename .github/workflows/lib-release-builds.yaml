on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v3

      - name: check if already released
        id: check
        run: |
          epoch=$(python3 -c "import yaml; print(yaml.safe_load(open('data.yaml'))['active_epoch'])")
          if [ -f "$epoch/${{ inputs.distro }}/released/seed-environment-conda-linux.yml" ]; then
            echo "Released directory already exists for ${{ inputs.distro }}, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  create-pr:
    needs: [check]
    if: ${{ needs.check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
      epoch: ${{ steps.vars.outputs.epoch }}
      has-osx: ${{ steps.vars.outputs.has-osx }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: set epoch and check osx
        id: vars
        run: |
          epoch=$(python3 -c "import yaml; print(yaml.safe_load(open('data.yaml'))['active_epoch'])")
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          if [ -f "$epoch/${{ inputs.distro }}/passed/seed-environment-conda-osx.yml" ]; then
            echo "has-osx=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-osx=false" >> "$GITHUB_OUTPUT"
          fi

      - name: copy seed envs to released
        run: |
          epoch='${{ steps.vars.outputs.epoch }}'
          distro='${{ inputs.distro }}'
          mkdir -p "$epoch/$distro/released"
          cp "$epoch/$distro/passed/seed-environment-conda-linux.yml" \
             "$epoch/$distro/released/"
          if [ '${{ steps.vars.outputs.has-osx }}' = 'true' ]; then
            cp "$epoch/$distro/passed/seed-environment-conda-osx.yml" \
               "$epoch/$distro/released/"
          fi

      - name: create pull request
        id: pr
        uses: qiime2-cutlery/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          branch: Release-${{ steps.vars.outputs.epoch }}/${{ inputs.distro }}
          title: "REL: ${{ steps.vars.outputs.epoch }} (${{ inputs.distro }})"
          body: |
            Automated release build for `${{ inputs.distro }}` triggered by `release-builds.yaml`.
          author: "q2d2 <q2d2.noreply@gmail.com>"
          committer: "q2d2 <q2d2.noreply@gmail.com>"
          commit-message: |
            REL: ${{ steps.vars.outputs.epoch }} (${{ inputs.distro }})

  await-linux:
    needs: [check, create-pr]
    if: ${{ needs.check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: await linux trial
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.create-pr.outputs.pr }}
        run: |
          echo "Waiting 60s for trial to start..."
          sleep 60

          TIMEOUT=21600
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEAD_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')

            RUN=$(gh api \
              "repos/qiime2/distributions/actions/runs?head_sha=$HEAD_SHA" \
              --jq '[.workflow_runs[] | select(.name == "ci-distro-trial-linux")] | first')

            if [ "$RUN" = "null" ] || [ -z "$RUN" ]; then
              COMMIT_MSG=$(gh api repos/qiime2/distributions/git/commits/$HEAD_SHA --jq '.message')
              if echo "$COMMIT_MSG" | grep -q '\[skip ci\]'; then
                PARENT_SHA=$(gh api repos/qiime2/distributions/git/commits/$HEAD_SHA --jq '.parents[0].sha')
                PARENT_RUN=$(gh api \
                  "repos/qiime2/distributions/actions/runs?head_sha=$PARENT_SHA" \
                  --jq '[.workflow_runs[] | select(.name == "ci-distro-trial-linux")] | first')
                PARENT_CONCLUSION=$(echo "$PARENT_RUN" | jq -r '.conclusion')
                if [ "$PARENT_CONCLUSION" = "success" ]; then
                  echo "Automated commit ($HEAD_SHA) on top of successful trial ($PARENT_SHA). Done."; exit 0
                fi
              fi
              echo "No run found yet for SHA $HEAD_SHA, waiting..."
              sleep 45; ELAPSED=$((ELAPSED + 45)); continue
            fi

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            echo "Run $RUN_ID (SHA $HEAD_SHA): status=$STATUS conclusion=$CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Linux trial succeeded."; exit 0
              else
                sleep 30
                NEW_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')
                if [ "$NEW_SHA" != "$HEAD_SHA" ]; then
                  echo "New commit detected ($NEW_SHA), continuing to poll..."
                  sleep 30; ELAPSED=$((ELAPSED + 60)); continue
                fi
                echo "Trial failed with conclusion: $CONCLUSION"; exit 1
              fi
            fi

            sleep 45; ELAPSED=$((ELAPSED + 45))
          done

          echo "Timed out waiting for linux trial."; exit 1

  await-osx:
    needs: [check, create-pr]
    if: ${{ needs.check.outputs.skip != 'true' && needs.create-pr.outputs.has-osx == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: await osx trial
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.create-pr.outputs.pr }}
        run: |
          echo "Waiting 60s for trial to start..."
          sleep 60

          TIMEOUT=21600
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEAD_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')

            RUN=$(gh api \
              "repos/qiime2/distributions/actions/runs?head_sha=$HEAD_SHA" \
              --jq '[.workflow_runs[] | select(.name == "ci-distro-trial-osx")] | first')

            if [ "$RUN" = "null" ] || [ -z "$RUN" ]; then
              COMMIT_MSG=$(gh api repos/qiime2/distributions/git/commits/$HEAD_SHA --jq '.message')
              if echo "$COMMIT_MSG" | grep -q '\[skip ci\]'; then
                PARENT_SHA=$(gh api repos/qiime2/distributions/git/commits/$HEAD_SHA --jq '.parents[0].sha')
                PARENT_RUN=$(gh api \
                  "repos/qiime2/distributions/actions/runs?head_sha=$PARENT_SHA" \
                  --jq '[.workflow_runs[] | select(.name == "ci-distro-trial-osx")] | first')
                PARENT_CONCLUSION=$(echo "$PARENT_RUN" | jq -r '.conclusion')
                if [ "$PARENT_CONCLUSION" = "success" ]; then
                  echo "Automated commit ($HEAD_SHA) on top of successful trial ($PARENT_SHA). Done."; exit 0
                fi
              fi
              echo "No run found yet for SHA $HEAD_SHA, waiting..."
              sleep 45; ELAPSED=$((ELAPSED + 45)); continue
            fi

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            echo "Run $RUN_ID (SHA $HEAD_SHA): status=$STATUS conclusion=$CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "OSX trial succeeded."; exit 0
              else
                sleep 30
                NEW_SHA=$(gh api repos/qiime2/distributions/pulls/$PR --jq '.head.sha')
                if [ "$NEW_SHA" != "$HEAD_SHA" ]; then
                  echo "New commit detected ($NEW_SHA), continuing to poll..."
                  sleep 30; ELAPSED=$((ELAPSED + 60)); continue
                fi
                echo "Trial failed with conclusion: $CONCLUSION"; exit 1
              fi
            fi

            sleep 45; ELAPSED=$((ELAPSED + 45))
          done

          echo "Timed out waiting for osx trial."; exit 1

  merge-pr:
    needs: [check, create-pr, await-linux, await-osx]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.check.outputs.skip != 'true' &&
      needs.create-pr.result == 'success' &&
      needs.await-linux.result == 'success' &&
      (needs.await-osx.result == 'success' || needs.await-osx.result == 'skipped')
    steps:
      - name: merge release pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/qiime2/distributions/pulls/${{ needs.create-pr.outputs.pr }}/merge
