on:
  workflow_call:
    inputs:
      repo:
        description: 'GitHub repository (org/repo) to update'
        type: string
        required: true
      rtd-slug:
        description: 'RTD project slug'
        type: string
        required: true
      active-epoch:
        description: 'Active release epoch (from data.yaml)'
        type: string
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}
    steps:
      - name: "checkout ${{ inputs.repo }}"
        uses: actions/checkout@v3
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.RTD_PAT }}
          fetch-depth: 0
          fetch-tags: true

      - name: "create ${{ inputs.active-epoch }} branch from main"
        run: |
          git checkout main
          git checkout -b ${{ inputs.active-epoch }}

      - name: "update RTD environment file"
        run: |
          sed -i 's|/passed|/released|g' environment-files/readthedocs.yml

      - name: "update versioned xrefs to ${{ inputs.active-epoch }}"
        run: |
          for domain in \
            "use\.qiime2\.org" \
            "develop\.qiime2\.org" \
            "gut-to-soil-tutorial\.readthedocs\.io" \
            "moving-pictures-tutorial\.readthedocs\.io" \
            "amplicon-docs\.qiime2\.org" \
            "amplicon-docs\.readthedocs\.io"; do
            find . -type f ! -path "*/_build/*" \
              \( -name "*.md" -o -name "*.yml" -o -name "*.yaml" \) \
              | xargs sed -i \
                "s|${domain}/en/latest/|${domain}/en/${{ inputs.active-epoch }}/|g"
          done

      - name: "commit and push ${{ inputs.active-epoch }} branch"
        run: |
          git config user.email "q2d2.noreply@gmail.com"
          git config user.name "q2d2"
          git add -A
          git commit -m "REL: ${{ inputs.active-epoch }}"
          git push origin ${{ inputs.active-epoch }}

      # The stable tag needs to be moved rather than deleted and recreated.
      # Deleting it first leaves a window where RTD stable version falls
      # back to the previous epoch (the highest version-like ref that
      # exists at that moment), and any build RTD queues in that window
      # publishes the prior epoch's docs as stable.
      # This came up in the 2026.7 release; MP and amplicon both ended up
      # one epoch behind while GTS did not, just based on webhook ordering.
      # A single force-push swaps the tag without any gap.
      - name: "move stable tag to ${{ inputs.active-epoch }}"
        id: stable-tag
        run: |
          git tag -f -a stable -m "REL: bump stable tag to ${{ inputs.active-epoch }}"
          git push origin --force refs/tags/stable
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Wait for RTD's version record to track the new epoch, then trigger the
      # build explicitly and assert it built the commit that was just pushed.
      - name: "rebuild and verify RTD stable"
        uses: qiime2/distributions/.github/actions/rtd-rebuild-stable@dev
        with:
          rtd-slug: ${{ inputs.rtd-slug }}
          epoch: ${{ inputs.active-epoch }}
          commit: ${{ steps.stable-tag.outputs.sha }}
