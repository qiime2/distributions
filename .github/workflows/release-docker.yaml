name: release-docker
on:
  workflow_dispatch:
    inputs:
      epoch:
        required: true
        type: string
      distro:
        required: true
        type: string

jobs:
  build:
    uses: qiime2/distributions/.github/workflows/lib-release-docker.yaml@dev
    with:
      epoch: ${{ inputs.epoch }}
      distro: ${{ inputs.distro }}
    secrets: inherit
