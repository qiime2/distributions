name: Update q2view in rachis-cli

on:
  workflow_call:

permissions:
  contents: read

jobs:
  update-pin:
    if: github.repository == 'VinzentRisch/q2view' && github.ref == 'refs/heads/rachis_cli_update_workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rachis-cli
        uses: actions/checkout@v4
        with:
          repository: rachis-org/rachis-cli
          ref: dev
          persist-credentials: false

      - name: Update the q2view submodule pin
        id: pin
        shell: bash
        run: |
          git submodule update --init -- q2view
          # Read main at run time so queued runs pick up the latest commit.
          git -C q2view fetch origin refs/heads/main
          target_sha=$(git -C q2view rev-parse FETCH_HEAD)
          pinned_sha=$(git rev-parse HEAD:q2view)

          if [[ "$target_sha" == "$pinned_sha" ]]; then
            echo "rachis-cli already pins q2view at $target_sha"
            exit 0
          fi

          git -C q2view checkout --detach "$target_sha"
          git add -- q2view
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Show the proposed submodule change
        run: git diff --cached --submodule=short -- q2view
