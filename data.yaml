# this is the current release epoch (i.e. 20XX.REL)
released_epoch: "2026.7"
# this is the current dev cycle epoch (i.e. 20XX.REL+1)
active_epoch: "2026.10"
# this is the next dev cycle epoch (i.e. 20XX.REL+2)
next_epoch: "2027.1"
# qiime2 distro (formerly amplicon) renamed for rachis release 2026.4
distros: [tiny, qiime2, moshpit, pathogenome, test]
# primary_distro refers to the distribution used to run ci-dev for each plugin
packages:

# moshpit proxy package
- name: moshpit
  repo: bokulich-lab/MOSHPIT
  distros: [moshpit]
  primary_distro: moshpit

