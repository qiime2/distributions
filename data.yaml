# qiime2 proxy package
# note: this repo does not use lib-ci-dev.yaml (custom nox/uv-based CI with no
# `distro:` concept), so primary_distro is intentionally omitted.
# Paired ci-dev discovery treats a missing primary_distro on a sibling as:
# skip the sibling.primary_distro containment check
# else: fall back to self.primary_distro in sibling.distros
- name: q2
  repo: qiime2/q2
  distros: [tiny, qiime2, moshpit, pathogenome, test]

# formerly qiime2
# note: this repo does not use lib-ci-dev.yaml (custom nox/uv-based CI with no
# `distro:` concept), so primary_distro is intentionally omitted.
# See note on the `qiime2` proxy package above.
- name: rachis
  repo: rachis-org/rachis
  distros: [tiny, qiime2, moshpit, pathogenome, test]

- name: rescript
  repo: bokulich-lab/RESCRIPt
  distros: [qiime2, moshpit]
  primary_distro: qiime2
